name: Publish verified Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Download and verify the exact successful main build
        run: python tools/ci_artifacts.py download-release --tag "$RELEASE_TAG" --wait-seconds 1200
      - name: Publish the verified files without rebuilding
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "VGHKS-bot $RELEASE_TAG" --notes-file RELEASE_NOTES.md \
            VGHKS-bot.exe VGHKS-bot-*-windows-x64.zip SHA256SUMS.txt
