name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.lock.txt
      - name: Test, build and verify the executable
        run: python tools/run_checks.py --build
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ github.sha }}
          path: .build/ci/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ github.sha }}
          path: |
            dist/VGHKS-bot.exe
            dist/VGHKS-bot-*-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-${{ github.sha }}
          path: release
      - name: Verify downloads and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "VGHKS-bot $RELEASE_TAG" --notes-file RELEASE_NOTES.md \
            VGHKS-bot.exe VGHKS-bot-*-windows-x64.zip SHA256SUMS.txt
