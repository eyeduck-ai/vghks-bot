name: Windows verification and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Source, pinned GAS contract and source self-tests
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read pinned GAS revision
        id: gas
        shell: pwsh
        run: |
          $revision = (Get-Content tests/fixtures/gas_contract.json -Raw | ConvertFrom-Json).revision
          if ($revision -notmatch '^[0-9a-f]{40}$') { throw 'Invalid GAS revision' }
          "revision=$revision" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: eyeduck-ai/op_spreadsheet
          ref: ${{ steps.gas.outputs.revision }}
          path: .build/gas-contract
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-build.lock.txt
      - run: python tools/run_checks.py --checks-only --gas-repo .build/gas-contract
      - run: python tools/run_checks.py --source-only
      - name: Upload source self-test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-${{ github.sha }}
          overwrite: true
          path: |
            .build/ci/source-selftest.json
            .build/ci/monitor-source-selftest.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  tests:
    name: Synthetic suite (${{ matrix.shard }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-build.lock.txt
      - run: python tools/test_suite.py --shard-index ${{ matrix.shard }} --shard-count 4 --report-dir .build/ci/shard-${{ matrix.shard }}
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shard-${{ matrix.shard }}-${{ github.sha }}
          overwrite: true
          path: .build/ci/shard-${{ matrix.shard }}/
          include-hidden-files: true
          retention-days: 14

  verified:
    name: Complete suite and both source self-tests
    needs: [checks, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: source-${{ github.sha }}
          path: .build/ci/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: shard-*-${{ github.sha }}
          path: .build/shards/
      - name: Collect shard reports
        run: |
          for shard in 0 1 2 3; do
            mv ".build/shards/shard-$shard-${{ github.sha }}" ".build/ci/shard-$shard"
          done
          python tools/ci_artifacts.py collect-tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-${{ github.sha }}
          overwrite: true
          path: .build/ci/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verified
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.lock.txt
      - name: Download source self-test reports from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tests-${{ github.sha }}
          path: .build/ci/
      - name: Build, verify and package both executables
        run: python tools/run_checks.py --build-only
      - name: Bind release files to this verified main run
        run: python tools/ci_artifacts.py record-build
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ github.sha }}
          overwrite: true
          path: .build/ci/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ github.sha }}
          overwrite: true
          path: |
            dist/VGHKS-bot.exe
            dist/VGHKS-calendar-monitor.exe
            dist/VGHKS-bot-*-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
            dist/BUILD_INFO.json
          if-no-files-found: error
          retention-days: 14
